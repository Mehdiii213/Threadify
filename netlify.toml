# Hébergement Netlify (étape 8b). Netlify détecte Next.js tout seul
# (adaptateur OpenNext) ; on ajoute seulement l'application des migrations
# Prisma sur la base de production avant chaque construction du site.
[build]
  command = "npx prisma migrate deploy && npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify bloque la construction s'il retrouve la valeur d'une variable dans
  # le code ou le site construit. Celles-ci ne sont PAS secrètes (adresse
  # publique du site, expéditeur des e-mails, identifiants de prix Stripe) :
  # on les exclut de la recherche. Les vraies clés restent surveillées.
  SECRETS_SCAN_OMIT_KEYS = "BETTER_AUTH_URL,EMAIL_FROM,STRIPE_PRICE_PRO,STRIPE_PRICE_EXPERT,STRIPE_PRICE_PRO_ANNUAL,STRIPE_PRICE_EXPERT_ANNUAL"

# Étape 8b (partie 2) : l'adresse officielle est https://threadify.fr. L'ancienne
# adresse Netlify redirige vers elle (sinon la connexion y serait refusée :
# Better Auth n'accepte que l'adresse de BETTER_AUTH_URL).
[[redirects]]
  from = "https://threadify-fr.netlify.app/*"
  to = "https://threadify.fr/:splat"
  status = 301
  force = true
